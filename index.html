<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squid 3D</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root { --ink: #1d2230; --muted: #6b7180; --line: rgba(29, 34, 48, .08); --hover: rgba(29, 34, 48, .06); --active: rgba(29, 34, 48, .1); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f4f6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  canvas { display: block; }

  /* HUD: a single slim toolbar of icon buttons, grouped by thin dividers */
  #hud { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: max-content; display: flex; justify-content: center; align-items: center; gap: 2px; padding: 4px;
    max-width: calc(100vw - 24px); flex-wrap: wrap;
    background: rgba(255, 255, 255, .78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, .05); }
  #hud .group { display: flex; gap: 2px; }
  #hud .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  #hud button { position: relative; width: 30px; height: 30px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer;
    transition: background .15s, color .15s; }
  #hud button:hover { background: var(--hover); color: var(--ink); }
  #hud button.on { background: var(--active); color: var(--ink); }
  #hud button:focus-visible { outline: 2px solid rgba(29, 34, 48, .35); outline-offset: 1px; }
  /* collapsed: only the toggle stays visible, tucked into the bottom-left corner */
  #hud.collapsed { left: 16px; transform: none; }
  #hud.collapsed > :not(#hudToggle) { display: none; }

  /* tooltip from aria-label */
  #hud button[aria-label]:hover::before { content: attr(aria-label); position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%); white-space: nowrap; padding: 3px 7px; border-radius: 6px; font-size: 11px;
    background: var(--ink); color: #fff; pointer-events: none; z-index: 2; }
  #hud.collapsed #hudToggle:hover::before { left: 0; transform: none; }

  /* camera view menu */
  .menu-wrap { position: relative; }
  .menu { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); display: none; min-width: 96px; padding: 4px;
    background: rgba(255, 255, 255, .92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, .08); z-index: 3; }
  .menu.open { display: block; }
  #hud .menu button { width: 100%; height: 28px; display: block; text-align: left; padding: 0 10px; font: 12px system-ui, sans-serif; }
  #hud .menu button:hover::before { content: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Generating model…</div>
<nav id="hud">
  <button id="hudToggle" aria-label="Hide panel (H)"><i class="ph ph-caret-left"></i></button>
  <span class="sep"></span>
  <div class="group">
    <button data-mode="idle" class="on" aria-label="Idle"><i class="ph ph-person-simple"></i></button>
    <button data-mode="walkInPlace" aria-label="Walk"><i class="ph ph-person-simple-walk"></i></button>
    <button data-mode="circle" aria-label="Walk in circle"><i class="ph ph-arrows-clockwise"></i></button>
    <button data-mode="dance" aria-label="Dance (G)"><i class="ph ph-music-notes"></i></button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button data-face="neutral" class="on" aria-label="Neutral face"><i class="ph ph-smiley-blank"></i></button>
    <button data-face="smile" aria-label="Smile (Y)"><i class="ph ph-smiley"></i></button>
    <button data-face="talk" aria-label="Talk (T)"><i class="ph ph-chat-teardrop-dots"></i></button>
    <button data-face="sad" aria-label="Sad (U)"><i class="ph ph-smiley-sad"></i></button>
    <button data-face="doubt" aria-label="Doubt"><i class="ph ph-smiley-x-eyes"></i></button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button data-arm="neutral" class="on" aria-label="Arms at rest"><i class="ph ph-hand"></i></button>
    <button data-arm="thumbsUp" aria-label="Thumbs up (1)"><i class="ph ph-thumbs-up"></i></button>
    <button data-arm="wave" aria-label="Wave (2)"><i class="ph ph-hand-waving"></i></button>
    <button data-arm="armUp" aria-label="Raise arm (3)"><i class="ph ph-hand-palm"></i></button>
    <button data-arm="shrug" aria-label="Shrug (4)"><i class="ph ph-question"></i></button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <div class="menu-wrap">
      <button id="viewMenuBtn" aria-label="Camera view"><i class="ph ph-video-camera"></i></button>
      <div class="menu" id="viewMenu">
        <button data-view="front" class="on">Front</button>
        <button data-view="side">Side</button>
        <button data-view="back">Back</button>
        <button data-view="3q">3/4</button>
      </div>
    </div>
    <button id="zoomOut" aria-label="Zoom out (−)"><i class="ph ph-magnifying-glass-minus"></i></button>
    <button id="zoomIn" aria-label="Zoom in (+)"><i class="ph ph-magnifying-glass-plus"></i></button>
    <button id="resetBtn" aria-label="Reset scene"><i class="ph ph-arrow-counter-clockwise"></i></button>
  </div>
</nav>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createCharacterModel } from './character.js';
import { CharacterStateMachine } from './animations.js';

const $ = (id) => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f4f6);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 6.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.minDistance = 1.2;
controls.maxDistance = 16;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(2.5, 5, 4);
key.castShadow = true;
// tight shadow frustum around the character (follows it in tick) → small texels, no aliasing
key.shadow.mapSize.set(4096, 4096);
key.shadow.camera.left = -1.8; key.shadow.camera.right = 1.8;
key.shadow.camera.top = 1.8; key.shadow.camera.bottom = -1.8;
key.shadow.camera.near = 1; key.shadow.camera.far = 14;
key.shadow.radius = 4;
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.012;
const KEY_OFFSET = new THREE.Vector3(2.5, 5, 4);
scene.add(key);
scene.add(key.target);
const rim = new THREE.DirectionalLight(0xffffff, 0.6);
rim.position.set(-3, 3, -4);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const character = createCharacterModel();
scene.add(character);
const fsm = new CharacterStateMachine(character);

// ---------- input ----------
const keys = new Set();
addEventListener('keydown', (e) => { keys.add(e.code); });
addEventListener('keyup', (e) => { keys.delete(e.code); });

// movement mode: idle | walkInPlace | circle | dance | free
let mode = 'idle';
const modeButtons = document.querySelectorAll('[data-mode]');
function setMode(m) {
  mode = m;
  modeButtons.forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
}
modeButtons.forEach((b) => b.onclick = () => setMode(b.dataset.mode));

// collapse/expand the HUD (remembered across reloads when the browser allows it)
const hud = $('hud'), hudToggle = $('hudToggle');
function setHudCollapsed(collapsed) {
  hud.classList.toggle('collapsed', collapsed);
  hudToggle.innerHTML = `<i class="ph ph-caret-${collapsed ? 'right' : 'left'}"></i>`;
  hudToggle.setAttribute('aria-label', `${collapsed ? 'Show' : 'Hide'} panel (H)`);
  try { localStorage.setItem('hudCollapsed', collapsed ? '1' : '0'); } catch (e) {}
}
try { setHudCollapsed(localStorage.getItem('hudCollapsed') === '1'); } catch (e) {}
hudToggle.onclick = () => setHudCollapsed(!hud.classList.contains('collapsed'));

const faceButtons = document.querySelectorAll('[data-face]');
function setFace(name) {
  fsm.setExpression(name);
  faceButtons.forEach((b) => b.classList.toggle('on', b.dataset.face === name));
}
faceButtons.forEach((b) => b.onclick = () => setFace(b.dataset.face));

const armButtons = document.querySelectorAll('[data-arm]');
// neutral = rest pose (stops the gesture; the arm eases back)
armButtons.forEach((b) => b.onclick = () => b.dataset.arm === 'neutral' ? fsm.stopArmAction() : fsm.playArmAction(b.dataset.arm));
const ARM_KEYS = { Digit1: 'thumbsUp', Digit2: 'wave', Digit3: 'armUp', Digit4: 'shrug' };

// ---------- camera ----------
const views = { front: [0, 1.2, 6.2], side: [6.2, 1.2, 0], back: [0, 1.2, -6.2], '3q': [4.2, 1.8, 4.6] };
const viewButtons = document.querySelectorAll('[data-view]');
const viewMenu = $('viewMenu'), viewMenuBtn = $('viewMenuBtn');
const setViewButton = (name) => viewButtons.forEach((b) => b.classList.toggle('on', b.dataset.view === name));
// dragging to orbit leaves the preset views
controls.addEventListener('start', () => setViewButton(null));
viewMenuBtn.onclick = (e) => { e.stopPropagation(); viewMenu.classList.toggle('open'); };
addEventListener('pointerdown', (e) => { if (!viewMenu.contains(e.target) && e.target !== viewMenuBtn) viewMenu.classList.remove('open'); });
function setView(name) {
  setViewButton(name);
  const v = views[name];
  camera.position.set(character.position.x + v[0], v[1], character.position.z + v[2]);
  controls.target.set(character.position.x, 1.0, character.position.z);
  zoomGoal = null;
}
viewButtons.forEach((b) => b.onclick = () => { setView(b.dataset.view); viewMenu.classList.remove('open'); });

// zoom: eases the camera distance toward a goal (each step is ±20%)
let zoomGoal = null;
function zoom(factor) {
  const dist = (zoomGoal ?? camera.position.distanceTo(controls.target)) * factor;
  zoomGoal = THREE.MathUtils.clamp(dist, controls.minDistance, controls.maxDistance);
}
$('zoomIn').onclick = () => zoom(1 / 1.25);
$('zoomOut').onclick = () => zoom(1.25);
renderer.domElement.addEventListener('wheel', () => { zoomGoal = null; }, { passive: true });

// reset: front view, character at the origin, standing still, neutral face, no gesture
function reset() {
  setMode('idle');
  setFace('neutral');
  fsm.stopArmAction(true);
  if (fsm.current !== 'idle') fsm.set('idle', 0.15);
  circleAngle = 0;
  character.position.set(0, 0, 0);
  character.rotation.set(0, 0, 0);
  setView('front');
  controls.update();
}
$('resetBtn').onclick = reset;

// ---------- shortcuts ----------
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (ARM_KEYS[e.code]) fsm.playArmAction(ARM_KEYS[e.code]);
  if (e.code === 'KeyH') setHudCollapsed(!hud.classList.contains('collapsed'));
  if (e.code === 'KeyT') setFace(fsm.expression === 'talk' ? 'neutral' : 'talk');
  if (e.code === 'KeyY') setFace(fsm.expression === 'smile' ? 'neutral' : 'smile');
  if (e.code === 'KeyU') setFace(fsm.expression === 'sad' ? 'neutral' : 'sad');
  if (e.code === 'KeyG') setMode(mode === 'dance' ? 'idle' : 'dance');
  if (e.code === 'Equal' || e.code === 'NumpadAdd') zoom(1 / 1.25);
  if (e.code === 'Minus' || e.code === 'NumpadSubtract') zoom(1.25);
});

const SPEED = 1.1;
let circleAngle = 0;
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const move = new THREE.Vector3(
    (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0), 0,
    (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0));
  if (move.lengthSq() > 0 && mode !== 'free') setMode('free');

  let moving = false, speed = 0;
  if (mode === 'walkInPlace') { moving = true; speed = SPEED; }
  else if (mode === 'circle') {
    moving = true; speed = SPEED;
    const R = 1.6;
    circleAngle += (SPEED / R) * dt;
    character.position.set(Math.sin(circleAngle) * R, 0, Math.cos(circleAngle) * R - R);
    character.rotation.y = circleAngle + Math.PI / 2;
  } else if (mode === 'free' && move.lengthSq() > 0) {
    // camera-relative movement
    const fwd = tmp.subVectors(controls.target, camera.position).setY(0).normalize();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
    const dir = new THREE.Vector3().addScaledVector(right, move.x).addScaledVector(fwd, -move.z).normalize();
    moving = true; speed = SPEED;
    character.position.addScaledVector(dir, SPEED * dt);
    camera.position.addScaledVector(dir, SPEED * dt);
    controls.target.addScaledVector(dir, SPEED * dt);
    const targetYaw = Math.atan2(dir.x, dir.z);
    let d = targetYaw - character.rotation.y;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    character.rotation.y += d * Math.min(1, dt * 10);
  }
  fsm.update(dt, { moving, speed, dancing: mode === 'dance' });
  const armNow = (!fsm.armAction?.stop && fsm.armAction?.name) || 'neutral';
  armButtons.forEach((b) => b.classList.toggle('on', armNow === b.dataset.arm));
  if (zoomGoal !== null) {
    const offset = tmp.subVectors(camera.position, controls.target);
    const dist = offset.length();
    const next = THREE.MathUtils.lerp(dist, zoomGoal, Math.min(1, dt * 10));
    camera.position.copy(controls.target).addScaledVector(offset.normalize(), next);
    if (Math.abs(next - zoomGoal) < 1e-3) zoomGoal = null;
  }
  key.target.position.set(character.position.x, 0.9, character.position.z);
  key.position.copy(key.target.position).add(KEY_OFFSET);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
// deterministic capture of a view (used by review gates; saved to evidence/ through dev_server.py)
async function capture(name, azimuthDeg, { dist = 4.2, height = 1.1, target = 1.0 } = {}) {
  const a = THREE.MathUtils.degToRad(azimuthDeg);
  const c = character.position;
  camera.position.set(c.x + Math.sin(a) * dist, height, c.z + Math.cos(a) * dist);
  controls.target.set(c.x, target, c.z);
  controls.update();
  key.target.position.set(c.x, 0.9, c.z);
  key.position.copy(key.target.position).add(KEY_OFFSET);
  renderer.render(scene, camera);
  const data = renderer.domElement.toDataURL('image/png');
  await fetch('/save', { method: 'POST', body: JSON.stringify({ name, data }) });
  return name;
}
$('loading')?.remove();
window.__app = { scene, camera, controls, character, fsm, setMode, setFace, renderer, capture, reset };
</script>
</body>
</html>
