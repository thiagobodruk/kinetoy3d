<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KineToy 3D</title>
<style>
  :root { --ink: #1d2230; --muted: #6b7180; --line: rgba(29, 34, 48, .08); --hover: rgba(29, 34, 48, .06); --active: rgba(29, 34, 48, .1); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f4f6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  canvas { display: block; }

  /* HUD: a single slim toolbar of icon buttons, grouped by thin dividers */
  #hud { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: max-content; display: flex; justify-content: center; align-items: center; gap: 2px; padding: 4px;
    max-width: calc(100vw - 24px); flex-wrap: wrap;
    background: rgba(255, 255, 255, .78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, .05); }
  #hud .group { display: flex; gap: 2px; }
  #hud .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  #hud button { position: relative; width: 30px; height: 30px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer;
    transition: background .15s, color .15s; }
  #hud button:hover { background: var(--hover); color: var(--ink); }
  #hud button.on { background: var(--active); color: var(--ink); }
  #hud button:focus-visible { outline: 2px solid rgba(29, 34, 48, .35); outline-offset: 1px; }
  /* collapsed: only the toggle stays visible, tucked into the bottom-left corner */
  #hud.collapsed { left: 16px; transform: none; }
  #hud.collapsed > :not(#hudToggle) { display: none; }

  /* tooltip from aria-label */
  #hud button[aria-label]:hover::before { content: attr(aria-label); position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%); white-space: nowrap; padding: 3px 7px; border-radius: 6px; font-size: 11px;
    background: var(--ink); color: #fff; pointer-events: none; z-index: 2; }
  #hud.collapsed #hudToggle:hover::before { left: 0; transform: none; }

  /* camera view menu */
  .menu-wrap { position: relative; }
  .menu { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); display: none; min-width: 96px; padding: 4px;
    background: rgba(255, 255, 255, .92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, .08); z-index: 3; }
  .menu.open { display: block; }
  #hud .menu button { width: 100%; height: 28px; display: block; text-align: left; padding: 0 10px; font: 12px system-ui, sans-serif; }
  #hud .menu button:hover::before { content: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div id="loading">Generating model…</div>
<nav id="hud">
  <button id="hudToggle" aria-label="Hide panel (H)"><i class="ph ph-caret-left"></i></button>
  <span class="sep"></span>
  <div class="group">
    <button data-mode="idle" class="on" aria-label="Idle"><i class="ph ph-person-simple"></i></button>
    <button data-mode="walkInPlace" aria-label="Walk"><i class="ph ph-person-simple-walk"></i></button>
    <button data-mode="circle" aria-label="Walk in circle"><i class="ph ph-arrows-clockwise"></i></button>
    <button data-mode="dance" aria-label="Dance (G)"><i class="ph ph-music-notes"></i></button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button data-face="neutral" class="on" aria-label="Neutral face"><i class="ph ph-smiley-blank"></i></button>
    <button data-face="smile" aria-label="Smile (Y)"><i class="ph ph-smiley"></i></button>
    <button data-face="talk" aria-label="Talk (T)"><i class="ph ph-chat-teardrop-dots"></i></button>
    <button data-face="sad" aria-label="Sad (U)"><i class="ph ph-smiley-sad"></i></button>
    <button data-face="doubt" aria-label="Doubt"><i class="ph ph-smiley-x-eyes"></i></button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button data-arm="neutral" class="on" aria-label="Arms at rest"><i class="ph ph-hand"></i></button>
    <button data-arm="thumbsUp" aria-label="Thumbs up (1)"><i class="ph ph-thumbs-up"></i></button>
    <button data-arm="wave" aria-label="Wave (2)"><i class="ph ph-hand-waving"></i></button>
    <button data-arm="armUp" aria-label="Raise arm (3)"><i class="ph ph-hand-palm"></i></button>
    <button data-arm="shrug" aria-label="Shrug (4)"><i class="ph ph-question"></i></button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <div class="menu-wrap">
      <button id="viewMenuBtn" aria-label="Camera view"><i class="ph ph-video-camera"></i></button>
      <div class="menu" id="viewMenu">
        <button data-view="front" class="on">Front</button>
        <button data-view="side">Side</button>
        <button data-view="back">Back</button>
        <button data-view="3q">3/4</button>
      </div>
    </div>
    <button id="zoomOut" aria-label="Zoom out (−)"><i class="ph ph-magnifying-glass-minus"></i></button>
    <button id="zoomIn" aria-label="Zoom in (+)"><i class="ph ph-magnifying-glass-plus"></i></button>
    <button id="resetBtn" aria-label="Reset scene"><i class="ph ph-arrow-counter-clockwise"></i></button>
  </div>
</nav>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
